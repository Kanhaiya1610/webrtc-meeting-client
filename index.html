<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#202124" />
  <title>Meet Clone – Real-time Video Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- Landing Page -->
  <div id="landingPage" class="landing-container">
    <div class="landing-content">
      <div class="logo-section">
        <i class="fas fa-video"></i>
        <h1>Meet Clone</h1>
        <p>Premium video meetings. Now free for everyone.</p>
      </div>
      
      <div class="auth-card">
        <div id="roomInviteNotice" class="room-invite-notice hidden" role="status" aria-live="polite">
          <i class="fas fa-link"></i>
          <div class="room-invite-notice-content">
            <div class="room-invite-notice-title">Meeting Invitation</div>
            <div class="room-invite-notice-code">Room: <strong id="inviteCodeDisplay"></strong></div>
            <div class="room-invite-notice-subtitle">Sign in with Google to enter automatically</div>
          </div>
        </div>
        <div id="gSignInDiv" class="google-signin" aria-label="Sign in with Google"></div>
        <p id="authStatus" class="auth-status" aria-live="polite">Sign in to continue</p>
        
        <div id="afterAuth" class="after-auth hidden">
          <div class="user-info">
            <div class="avatar" id="userAvatar"></div>
            <div class="user-details">
              <p class="user-name" id="userName"></p>
              <p class="user-email" id="userEmail"></p>
            </div>
          </div>
          
          <div class="action-buttons">
            <button class="btn-primary" onclick="createRoom()">
              <i class="fas fa-video"></i>
              New Meeting
            </button>
            <div class="join-section">
              <label class="sr-only" for="roomIdInput">Meeting code</label>
              <input type="text" id="roomIdInput" placeholder="Enter meeting code" maxlength="8" />
              <button class="btn-secondary" onclick="joinRoomPrompt()">
                <i class="fas fa-sign-in-alt"></i>
                Join
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Meeting Room -->
  <div id="meetingRoom" class="meeting-room hidden">
    <!-- Header -->
    <header class="meeting-header">
      <div class="header-left">
        <div class="room-info">
          <i class="fas fa-video"></i>
          <span id="roomDisplay">Room: Not connected</span>
        </div>
        <button class="btn-copy" id="copyRoomBtn" onclick="copyRoomId()" title="Copy Meeting Code" aria-label="Copy meeting code">
          <i class="fas fa-copy"></i>
          Copy code
        </button>
        <button class="btn-copy btn-copy-link" id="copyLinkBtn" onclick="copyMeetingLink()" title="Copy Meeting Link" aria-label="Copy meeting link">
          <i class="fas fa-link"></i>
          Copy link
        </button>
      </div>
      
      <div class="header-right">
        <div class="connection-status" id="connectionStatus" role="status" aria-live="polite">
          <i class="fas fa-circle"></i>
          <span>Connected</span>
        </div>
        <button type="button" class="participant-count" onclick="toggleSidePanel('participants')" aria-label="Open participants">
          <i class="fas fa-users"></i>
          <span id="participantCountBadge">1</span>
        </button>
        <button class="btn-icon" onclick="signOut()" title="Sign Out" aria-label="Sign out">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </header>

    <!-- Video Grid -->
    <div class="video-container">
      <div id="videoGrid" class="video-grid">
        <!-- Videos will be added here dynamically -->
      </div>
      
      <!-- NEW: Captions Container -->
        <div id="captionsContainer" class="captions-container hidden" role="log" aria-live="polite" aria-label="Live captions">
        <div class="captions-header">
          <span>Live Captions</span>
          <div class="captions-header-actions">
            <button class="btn-icon-small" onclick="showCaptionSettings()" title="Caption Settings" aria-label="Caption settings">
              <i class="fas fa-cog"></i>
            </button>
            <button class="btn-icon-small" onclick="stopCaptions()" title="Close Captions" aria-label="Close captions">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
        <div id="captionsDisplay" class="captions-display">
          <!-- Live captions will appear here -->
        </div>
      </div>
      
      <!-- Connection Quality Indicator -->
      <div id="qualityIndicator" class="quality-indicator hidden">
        <i class="fas fa-signal"></i>
        <span>Checking connection quality...</span>
      </div>
    </div>

    <!-- Controls Bar -->
    <div class="controls-bar" role="toolbar" aria-label="Meeting controls">
      <div class="controls-center">
        <button class="control-btn" id="toggleMicBtn" onclick="toggleMic()" title="Mute/Unmute" aria-label="Mute or unmute microphone">
          <i class="fas fa-microphone" id="micIcon"></i>
        </button>
        
        <button class="control-btn" id="toggleCamBtn" onclick="toggleCamera()" title="Camera On/Off" aria-label="Turn camera on or off">
          <i class="fas fa-video" id="camIcon"></i>
        </button>
        
        <button class="control-btn btn-danger" onclick="leaveMeeting()" title="Leave Meeting" aria-label="Leave meeting">
          <i class="fas fa-phone-slash"></i>
        </button>
        
        <button class="control-btn hidden" id="raiseHandBtn" onclick="toggleRaiseHand()" title="Raise Hand" aria-label="Raise or lower hand">
          <i class="far fa-hand-paper"></i>
        </button>
        
        <button class="control-btn" id="screenShareBtn" onclick="toggleScreenShare()" title="Share screen" aria-label="Share or stop sharing screen">
          <i class="fas fa-desktop"></i>
        </button>
        
        <button class="control-btn" id="recordBtn" onclick="toggleRecording()" title="Start recording" aria-label="Start or stop recording">
          <i class="fas fa-record-vinyl"></i>
        </button>
        
        <!-- NEW: Captions Button -->
        <button class="control-btn" id="captionsBtn" onclick="toggleCaptions()" title="Turn on captions" aria-label="Turn live captions on or off">
          <i class="far fa-closed-captioning"></i>
        </button>
        
        <button class="control-btn" onclick="toggleSidePanel('chat')" title="Chat" aria-label="Open chat">
          <i class="fas fa-comment"></i>
          <span class="notification-badge hidden" id="chatNotificationBadge">0</span>
        </button>
        
        <button class="control-btn" onclick="toggleSidePanel('participants')" title="Participants" aria-label="Open participants">
          <i class="fas fa-users"></i>
        </button>
        
        <button class="control-btn hidden" id="endMeetingBtn" onclick="endMeeting()" title="End Meeting for All" aria-label="End meeting for everyone">
          <i class="fas fa-stop-circle"></i>
        </button>
      </div>
    </div>

    <!-- Side Panel -->
    <aside id="sidePanel" class="side-panel" role="dialog" aria-label="Meeting details" aria-modal="false">
      <div class="panel-header">
        <div class="panel-tabs">
          <button class="tab-btn active" id="participantsTab" onclick="showPanelTab('participants')">
            <i class="fas fa-users"></i>
            Participants
          </button>
          <button class="tab-btn" id="chatTab" onclick="showPanelTab('chat')">
            <i class="fas fa-comment"></i>
            Chat
          </button>
        </div>
        <button class="close-panel" onclick="closeSidePanel()" aria-label="Close meeting details">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- Participants Panel -->
      <div id="participantsPanel" class="panel-content">
        <div class="participants-header">
          <h3>In this meeting (<span id="participantCount">1</span>)</h3>
          <button class="btn-icon hidden" id="muteAllBtn" onclick="muteAll()" title="Mute All">
            <i class="fas fa-microphone-slash"></i>
          </button>
        </div>
        <div id="participantsList" class="participants-list">
          <!-- Participants will be listed here -->
        </div>
      </div>

      <!-- Chat Panel -->
      <div id="chatPanel" class="panel-content hidden">
        <div id="chatMessages" class="chat-messages">
          <!-- Chat messages will appear here -->
        </div>
        <div class="chat-input-container">
          <label class="sr-only" for="chatInput">Chat message</label>
          <textarea id="chatInput" placeholder="Send a message..." rows="1" aria-label="Chat message"></textarea>
          <button class="send-btn" onclick="sendChatMessage()" aria-label="Send chat message">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden" role="status" aria-live="assertive">
    <div class="loading-spinner"></div>
    <p id="loadingText">Connecting...</p>
  </div>

  <!-- Toast Notifications -->
  <div id="toastContainer" class="toast-container" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
